name: Remote automation checks

on:
  pull_request:
    paths:
      - scripts/automation/**
      - .github/workflows/remote-automation-ci.yml
      - .github/workflows/ai-repair.yml
      - .github/workflows/ai-repair-independent-review.yml
      - .github/workflows/ai-repair-promote.yml
      - .github/workflows/ai-repair-observe.yml
      - .github/workflows/ticket-repair.yml
      - .github/workflows/ticket-repair-reconcile.yml
      - .github/workflows/ticket-clarification-smoke.yml
      - .github/workflows/terra-issue-one-shot.yml
      - .github/workflows/ticket-terra-issue-smoke.yml
      - .github/workflows/ticket-repair-bridge-e2e-smoke.yml
      - .github/workflows/source-repair-ci.yml
      - .github/workflows/monitor-alert.yml
  push:
    branches: [main]
    paths:
      - scripts/automation/**
      - .github/workflows/remote-automation-ci.yml
      - .github/workflows/ai-repair.yml
      - .github/workflows/ai-repair-independent-review.yml
      - .github/workflows/ai-repair-promote.yml
      - .github/workflows/ai-repair-observe.yml
      - .github/workflows/ticket-repair.yml
      - .github/workflows/ticket-repair-reconcile.yml
      - .github/workflows/ticket-clarification-smoke.yml
      - .github/workflows/terra-issue-one-shot.yml
      - .github/workflows/ticket-terra-issue-smoke.yml
      - .github/workflows/ticket-repair-bridge-e2e-smoke.yml
      - .github/workflows/source-repair-ci.yml
      - .github/workflows/monitor-alert.yml

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Application tests
        run: npm test -- --maxWorkers=2
      - name: Install Japanese PDF renderer
        run: sudo apt-get update && sudo apt-get install -y python3-reportlab fonts-ipafont-gothic
      - name: Monitor tests
        run: node --test scripts/automation/*.nodecheck.mjs
      - name: Atomic support repair bridge database tests
        run: bash scripts/automation/test-support-automation-reply-sql.sh
      - name: Synthetic clarification cleanup database tests
        run: bash scripts/automation/test-ticket-clarification-smoke-sql.sh
      - name: Synthetic linked PR cleanup database tests
        run: bash scripts/automation/test-ticket-repair-bridge-e2e-smoke-sql.sh
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build --file scripts/automation/Dockerfile --tag yutakasa-remote-monitor:ci .
