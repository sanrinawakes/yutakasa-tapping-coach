name: Source repair checks

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/source-repair-ci.yml
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/source-repair-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build
