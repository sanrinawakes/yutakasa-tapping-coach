name: Review support repair release evidence

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe reads due counts only; reconcile processes due work'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - reconcile

permissions:
  contents: read

concurrency:
  group: yutakasa-ticket-repair-reconcile
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'sanrinawakes/yutakasa-tapping-coach' &&
      github.ref == 'refs/heads/main' &&
      vars.YUTAKASA_TICKET_RECONCILE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Move exhausted or unproven repairs to manual review
        env:
          TICKET_RECONCILE_ENABLED: ${{ vars.YUTAKASA_TICKET_RECONCILE_ENABLED }}
          TICKET_RECONCILE_MODE: ${{ inputs.mode }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.YUTAKASA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.YUTAKASA_SUPABASE_SERVICE_ROLE_KEY }}
          YUTAKASA_OPENAI_API_KEY: ${{ secrets.YUTAKASA_OPENAI_API_KEY }}
          YUTAKASA_OPENAI_PROJECT_ID: ${{ vars.YUTAKASA_OPENAI_PROJECT_ID }}
          YUTAKASA_OPENAI_CAP_CONFIRMED_PROJECT_ID: ${{ vars.YUTAKASA_OPENAI_CAP_CONFIRMED_PROJECT_ID }}
          YUTAKASA_OPENAI_CAP_CONFIRMED_USD: ${{ vars.YUTAKASA_OPENAI_CAP_CONFIRMED_USD }}
          YUTAKASA_OPENAI_KEY_SHA256: ${{ vars.YUTAKASA_OPENAI_KEY_SHA256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/automation/ticket-repair-reconcile.mjs
