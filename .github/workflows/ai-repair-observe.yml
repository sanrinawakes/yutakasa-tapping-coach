name: Observe merged AI repair

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run the guarded production observer from Railway fallback
        required: true
        type: choice
        options:
          - observe

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: yutakasa-ai-repair-observe
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'sanrinawakes/yutakasa-tapping-coach' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
        vars.YUTAKASA_REPAIR_OBSERVER_RAILWAY_FALLBACK_ENABLED != 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        vars.YUTAKASA_REPAIR_OBSERVER_RAILWAY_FALLBACK_ENABLED == 'true' &&
        inputs.mode == 'observe'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix scripts/automation
      - name: Check production SHA, logs, and database; record one observation
        env:
          SUPABASE_URL: ${{ secrets.YUTAKASA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.YUTAKASA_SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.YUTAKASA_CRON_SECRET }}
          JWT_SECRET: ${{ secrets.YUTAKASA_JWT_SECRET }}
          VERCEL_TOKEN: ${{ secrets.YUTAKASA_VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          OBSERVE_MODE: ${{ inputs.mode }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AI_REPAIR_FUNCTIONAL_SMOKE_ENABLED: ${{ vars.YUTAKASA_REPAIR_FUNCTIONAL_SMOKE_ENABLED }}
          YUTAKASA_FULL_AUTO_REHEARSAL_RUN_ID: ${{ vars.YUTAKASA_FULL_AUTO_REHEARSAL_RUN_ID }}
          YUTAKASA_AUTO_MERGE_REHEARSAL_WORK_ID: ${{ vars.YUTAKASA_AUTO_MERGE_REHEARSAL_WORK_ID }}
        run: node scripts/automation/ai-repair-observe.mjs
