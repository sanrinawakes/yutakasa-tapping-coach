name: Daily support report checks

on:
  pull_request:
    paths:
      - scripts/daily-report/**
      - .github/workflows/daily-support-report-ci.yml
  push:
    branches: [main]
    paths:
      - scripts/daily-report/**
      - .github/workflows/daily-support-report-ci.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Application tests
        run: npm test -- --maxWorkers=2
      - name: Daily report tests
        run: node --test scripts/daily-report/*.nodecheck.mjs
      - name: Daily report SQL ledger test
        run: sh scripts/daily-report/test-ledger-sql.sh
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build --file scripts/daily-report/Dockerfile --tag yutakasa-daily-support-report:ci .
