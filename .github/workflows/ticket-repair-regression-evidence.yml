name: Ticket repair regression evidence

on:
  workflow_dispatch:
    inputs:
      work_id:
        description: Opaque work UUID; never customer text
        required: true
        type: string
      pr_number:
        description: Repair draft PR number
        required: true
        type: string
      scenario_key:
        description: Fixed supported technical symptom
        required: true
        type: choice
        options:
          - chat_send_reload_persistence
          - chat_stream_completion

permissions:
  contents: read

concurrency:
  group: yutakasa-ticket-regression-${{ inputs.work_id }}
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      github.repository == 'sanrinawakes/yutakasa-tapping-coach' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare one new regression against the exact PR base and head
        env:
          WORK_ID: ${{ inputs.work_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SCENARIO_KEY: ${{ inputs.scenario_key }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          EVIDENCE_PATH: ${{ runner.temp }}/ticket-regression-evidence.json
        run: node scripts/automation/ticket-repair-regression-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-regression-evidence
          path: ${{ runner.temp }}/ticket-regression-evidence.json
          if-no-files-found: error
          retention-days: 7
