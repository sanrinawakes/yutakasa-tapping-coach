name: Ticket repair regression evidence

on:
  workflow_run:
    workflows: [AI repair independent review]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: yutakasa-ticket-regression-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'sanrinawakes/yutakasa-tapping-coach' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.select.outputs.eligible }}
      work_id: ${{ steps.select.outputs.work_id }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      scenario_key: ${{ steps.select.outputs.scenario_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: select
        name: Select one exact private ticket without exposing its text
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          YUTAKASA_AUTO_MERGE_ENABLED: ${{ vars.YUTAKASA_AUTO_MERGE_ENABLED }}
          YUTAKASA_AUTO_MERGE_REHEARSAL_WORK_ID: ${{ vars.YUTAKASA_AUTO_MERGE_REHEARSAL_WORK_ID }}
          YUTAKASA_AUTO_MERGE_REHEARSAL_HEAD_SHA: ${{ vars.YUTAKASA_AUTO_MERGE_REHEARSAL_HEAD_SHA }}
          REPAIR_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.YUTAKASA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.YUTAKASA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation/ticket-repair-regression-prepare.mjs
  compare:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare one new regression against the exact PR base and head
        env:
          WORK_ID: ${{ needs.prepare.outputs.work_id }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          SCENARIO_KEY: ${{ needs.prepare.outputs.scenario_key }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          EVIDENCE_PATH: ${{ runner.temp }}/ticket-regression-evidence.json
        run: node scripts/automation/ticket-repair-regression-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-regression-evidence
          path: ${{ runner.temp }}/ticket-regression-evidence.json
          if-no-files-found: error
          retention-days: 7
