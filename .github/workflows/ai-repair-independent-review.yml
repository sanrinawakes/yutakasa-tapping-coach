name: AI repair independent review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: ai-repair-independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record non-AI PR as outside the AI repair review scope
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'codex/yutakasa-ai-repair-')
        run: echo '{"ok":true,"code":"not_ai_repair"}'
      - uses: actions/checkout@v4
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'codex/yutakasa-ai-repair-')
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a private diff without executing PR code
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'codex/yutakasa-ai-repair-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          umask 077
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          node scripts/automation/ai-repair-review-candidate.mjs
          git diff --no-ext-diff --unified=40 "$BASE_SHA" "$HEAD_SHA" -- src > ai-repair-review.diff
          test -s ai-repair-review.diff
          test "$(stat -c %a ai-repair-review.diff)" = 600
      - name: Review the exact PR head independently
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'codex/yutakasa-ai-repair-')
        env:
          AI_REPAIR_DIFF_PATH: ai-repair-review.diff
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          YUTAKASA_OPENAI_API_KEY: ${{ secrets.YUTAKASA_OPENAI_API_KEY }}
          YUTAKASA_OPENAI_PROJECT_ID: ${{ vars.YUTAKASA_OPENAI_PROJECT_ID }}
          YUTAKASA_OPENAI_CAP_CONFIRMED_PROJECT_ID: ${{ vars.YUTAKASA_OPENAI_CAP_CONFIRMED_PROJECT_ID }}
          YUTAKASA_OPENAI_CAP_CONFIRMED_USD: ${{ vars.YUTAKASA_OPENAI_CAP_CONFIRMED_USD }}
          YUTAKASA_OPENAI_KEY_SHA256: ${{ vars.YUTAKASA_OPENAI_KEY_SHA256 }}
        run: node scripts/automation/ai-repair-independent-review.mjs
